<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>WeatherApp</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="search-box">
                <input type="text" placeholder="Enter your city" class="input-box">
                <button id="searchBtn" type="button">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>            
            </div>
        </div>

        <div class="error">
            <h1>Sorry, Location not found!</h1>
            <img src="./assets/404.png" alt="404 Error">
        </div>

        <div class="weather-body">
            <img src="./assets//cloud.png" alt="Weather image" class="weather-image">
            <div class="weather-box">
                <p class="temperature"> 0 <sup>°</sup></p>
                <p class="description"> rainy</p>
            </div>
            <div class="weather-details">
                <div class="humidity">
                    <div class="text">
                        <i class="fa-solid fa-droplet"></i>
                        <span id="humidity">45%</span>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="wind">
                    <i class="fa-solid fa-wind"></i>
                    <div class="text">
                        <span id="wind-speed">100km/H</span>
                        <p>Wind</p>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://kit.fontawesome.com/b69af99d15.js" crossorigin="anonymous"></script>
    <script src="./script.js"></script>

</body>
</html>
